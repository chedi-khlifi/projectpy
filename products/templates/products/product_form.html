<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background: #f4f7fb; }
        .card { background: white; border-radius: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); padding: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display:block; margin-bottom:0.4rem; color:#344050; font-weight:600; }
        input, textarea { width:100%; padding:0.9rem 1rem; border:1px solid #d7dbe2; border-radius:10px; }
        button { background:#0056d6; color:white; border:none; padding:0.9rem 1.4rem; border-radius:10px; cursor:pointer; }
        .actions { margin-top:1rem; }
        a { color:#0056d6; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ title }}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-group">
                {{ form.name.label_tag }}
                {{ form.name }}
                {{ form.name.errors }}
            </div>
            <div class="form-group">
                {{ form.description.label_tag }}
                {{ form.description }}
                {{ form.description.errors }}
            </div>
            <div class="actions">
                <button type="submit">Save</button>
                <a href="{% url 'home' %}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
