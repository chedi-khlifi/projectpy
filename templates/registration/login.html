<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 3rem auto; padding: 0 1rem; background: #eef2f7; }
        .card { background: white; border-radius: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); padding: 2rem; }
        label { display:block; margin-bottom:0.5rem; font-weight:600; color:#3b4a5a; }
        input { width:100%; border:1px solid #d7dde6; border-radius:10px; padding:0.9rem 1rem; margin-bottom:1.2rem; }
        button { background:#0056d6; color:white; padding:0.9rem 1.4rem; border:none; border-radius:10px; cursor:pointer; }
        .hint { margin-top:1rem; color:#5a6b80; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="id_username">Username</label>
            {{ form.username }}
            <label for="id_password">Password</label>
            {{ form.password }}
            <button type="submit">Sign in</button>
        </form>
        <p class="hint">Use Django admin credentials or create a user with <code>python manage.py createsuperuser</code>.</p>
    </div>
</body>
</html>
